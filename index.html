<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自我使用说明书 - 高考志愿版</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0}

/* ── Page shell ── */
body{background:#e8e4da;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px 0;font-family:'Noto Sans SC',sans-serif}

/* ── Phone frame ── */
.phone-wrap{position:relative}
.phone{
  width:360px;
  background:#f7f4ee;
  border-radius:44px;
  border:2px solid #c8c4b8;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  height:740px;
  box-shadow:0 24px 56px rgba(32,28,24,0.18),0 4px 12px rgba(32,28,24,0.10);
  position: relative;
}

/* ── Notch ── */
.notch{height:28px;background:#ede9df;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notch-pill{width:84px;height:10px;background:#c2beb3;border-radius:10px}

/* ── Header ── */
.hd{padding:12px 18px 10px;background:#f7f4ee;border-bottom:0.5px solid #ddd9cf;flex-shrink:0;display:flex;align-items:center;gap:10px}
.hd-dot{width:8px;height:8px;border-radius:50%;background:#8f3d2c;flex-shrink:0;animation: pulse 2s infinite;}
@keyframes pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(143, 61, 44, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(143, 61, 44, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(143, 61, 44, 0); }
}
.hd-text{}
.hd-name{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:600;color:#2e2b27;letter-spacing:0.04em}
.hd-sub{font-size:10px;color:#8a8278;margin-top:1px;letter-spacing:0.06em}

/* ── Chat messages ── */
.msgs{flex:1;overflow-y:auto;padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.msgs::-webkit-scrollbar{width:0}

.row{display:flex;max-width:100%;animation:fi 0.28s ease forwards;opacity:0}
.row.ai{justify-content:flex-start}
.row.user{justify-content:flex-end}

.bub{padding:9px 13px;border-radius:16px;font-size:12.5px;line-height:1.75;letter-spacing:0.01em;max-width:248px;word-break:break-all}
.bub.ai{background:#ece6da;color:#2e2b27;border-bottom-left-radius:3px}
.bub.user{background:#2e2b27;color:#f5f1ea;border-bottom-right-radius:3px}

/* typing dots */
.typing-row{display:flex;justify-content:flex-start;margin-bottom:8px;animation:fi 0.2s ease forwards}
.typing{display:flex;gap:4px;align-items:center;padding:12px 16px;background:#ece6da;border-radius:16px;border-bottom-left-radius:3px;width:fit-content}
.typing span{width:6px;height:6px;background:#8a8278;border-radius:50%;animation:bop 1.1s ease infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* ── Question choices area ── */
.choices-box{
  background:#f7f4ee;
  border-top:0.5px solid #ddd9cf;
  padding:10px 14px;
  display:flex;
  flex-direction:column;
  gap:6px;
  flex-shrink:0;
  transition: all 0.3s ease;
}
.choices-title{
  font-size:10.5px;
  color:#8a8278;
  letter-spacing:0.02em;
  margin-bottom:2px;
  display:flex;
  align-items:center;
  gap:4px;
}
.choices-grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:8px;
}
.choice-btn{
  background:#faf7f2;
  border:1px solid #dcd7cd;
  border-radius:10px;
  padding:10px 8px;
  font-size:11.5px;
  color:#4a423a;
  text-align:center;
  cursor:pointer;
  transition:all 0.2s;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1.4;
  height:44px;
  overflow:hidden;
  text-overflow:ellipsis;
  font-weight:500;
}
.choice-btn:hover, .choice-btn:active{
  background:#2e2b27;
  color:#f7f4ee;
  border-color:#2e2b27;
}

/* ── Quick-reply chips (post-report) ── */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;flex-shrink:0;background:#f7f4ee;border-top:0.5px solid #ddd9cf;}
.chip{flex:1;text-align:center;min-width:90px;padding:8px 10px;background:#ece6da;border:0.5px solid #c8c4b8;border-radius:10px;font-size:11px;color:#2e2b27;cursor:pointer;letter-spacing:0.02em;transition:all 0.15s;font-weight:500;}
.chip:hover{background:#2e2b27;color:#f7f4ee;border-color:#2e2b27}

/* ── Input row ── */
.inp-row{display:flex;gap:8px;padding:10px 14px 14px;border-top:0.5px solid #ddd9cf;background:#f7f4ee;flex-shrink:0;align-items:flex-end}
.inp-row textarea{flex:1;background:#ece6da;border:none;border-radius:12px;padding:9px 12px;font-size:12.5px;font-family:'Noto Sans SC',sans-serif;color:#2e2b27;resize:none;height:38px;max-height:80px;line-height:1.5;outline:none}
.inp-row textarea::placeholder{color:#a09890}
.send-btn{width:38px;height:38px;border-radius:50%;background:#2e2b27;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity 0.18s}
.send-btn:hover{opacity:0.72}
.send-btn svg{width:16px;height:16px;fill:#f7f4ee}

/* ── Tabs ── */
.tabs{display:flex;border-top:0.5px solid #ddd9cf;flex-shrink:0;z-index:5}
.tab{flex:1;padding:12px 0;font-size:11px;color:#8a8278;text-align:center;cursor:pointer;background:#f7f4ee;letter-spacing:0.06em;transition:all 0.15s}
.tab.on{color:#2e2b27;font-weight:700;border-top:2px solid #2e2b27;margin-top:-0.5px;background:#faf7f2}

/* ── Highly Aesthetic Shareable Report Panel ── */
.rp{
  height: 0;
  flex: 1 1 auto;
  overflow-y: auto;
  display: none;
  flex-direction: column;
  background: #f5eedf;
  padding: 14px;
  -webkit-overflow-scrolling: touch;
}
.rp::-webkit-scrollbar{width:0}

/* Poster Card Frame */
.poster-card{
  background:#faf7f2;
  border: 1px solid #2e2b27;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(46,43,39,0.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  padding: 18px;
  min-height: max-content;
  flex-shrink: 0;
}
.poster-card::before{
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 6px;
  background: repeating-linear-gradient(90deg, #8f3d2c, #8f3d2c 10px, #2e2b27 10px, #2e2b27 20px);
}

/* Hero banner */
.r-hero{
  padding: 16px 0 12px;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  border-bottom: 1.5px dashed #c8c4b8;
  margin-bottom: 14px;
}
.r-hero-eye{
  font-size:8.5px;letter-spacing:0.25em;color:#8f3d2c;text-transform:uppercase;margin-bottom:6px;font-weight:700;
  border: 1px solid #8f3d2c; padding: 2px 6px; border-radius: 4px;
}
.r-hero-badge{
  font-family:'Noto Serif SC',serif;
  font-size:23px;font-weight:900;color:#2e2b27;
  letter-spacing:0.04em;line-height:1.2;
  margin: 6px 0;
}
.r-hero-line{font-size:11.5px;color:#8a8278;line-height:1.5;max-width:280px;letter-spacing:0.02em}

/* Aesthetic Widgets Grid */
.r-body{display:flex;flex-direction:column;gap:12px;padding: 0;}

.r-block{
  background:#faf7f2;
  border-radius:10px;
  overflow:hidden;
  border:1px dashed #dcd7cd;
  animation:fi 0.3s ease forwards;opacity:0;
  padding: 12px;
}
.r-block.flash{animation:flash-in 0.5s ease forwards}

.r-block-head{
  display:flex;align-items:center;gap:6px;
  margin-bottom: 8px;
}
.r-icon{font-size:13px;line-height:1}
.r-lbl{font-size:10px;letter-spacing:0.1em;color:#8f3d2c;text-transform:uppercase;font-weight:700}

/* Specially Styled Energy Gauge for core drive */
.drive-gauge-container{
  margin-top: 8px;
  height: 4px;
  background: #ece6da;
  border-radius: 2px;
  overflow: hidden;
}
.drive-gauge{
  height: 100%;
  width: 85%;
  background: #8f3d2c;
  border-radius: 2px;
}

/* Beautiful Typographical styles for parsed sections */
.r-txt{
  font-size:11.5px;
  line-height:1.65;
  color:#2e2b27;
  background:#f6f1e5;
  padding:10px 12px;
  border-radius:6px;
  font-weight: 500;
}
.r-txt-summary {
  font-size: 13px;
  font-weight: 700;
  color: #8f3d2c;
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px dashed #dcd7cd;
}
.r-txt-insight {
  font-size: 11.5px;
  line-height: 1.65;
  color: #4a423a;
  margin-bottom: 8px;
}
.r-txt-action {
  font-size: 11px;
  line-height: 1.5;
  color: #2e2b27;
  background: #fdfaf5;
  border: 1px dashed #dcd7cd;
  border-radius: 6px;
  padding: 6px 10px;
  font-weight: 600;
}

/* WARNING BOX (Known Bug) styled like a retro warning label */
.r-block.warning-block {
  border: 1.5px solid #d4a373;
  background: #fdfaf5;
}
.r-block.warning-block .r-lbl {
  color: #c97a34;
}
.r-block.warning-block .r-txt {
  background: #fcf1e3;
  border-left: 3px solid #d4a373;
  color: #5c4328;
}

/* Super Elegant Professional Diagnosis Certificate (Major Recommendation) */
.r-block.major-recommendation {
  border: 1.5px solid #8f3d2c;
  background: #fcf8f2;
  position: relative;
}
.r-block.major-recommendation::after{
  content: 'RECOMMENDED';
  position: absolute;
  right: -10px; bottom: -5px;
  font-size: 26px;
  font-family: 'Noto Serif SC', serif;
  font-weight: 900;
  color: rgba(143, 61, 44, 0.05);
  transform: rotate(-10deg);
  pointer-events: none;
}
.r-block.major-recommendation .r-block-head {
  border-bottom: 1px solid #f3e5d8;
  padding-bottom: 4px;
  margin-bottom: 8px;
}
.r-block.major-recommendation .r-lbl {
  color: #8f3d2c;
  font-size: 11px;
}
.r-block.major-recommendation .r-txt {
  border-left: 3px solid #8f3d2c;
  background: #f7eedf;
  font-size: 12px;
  line-height: 1.7;
}

/* Poster Footer */
.poster-footer{
  margin-top: 18px;
  border-top: 1.5px dashed #c8c4b8;
  padding-top: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.poster-barcode{
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.barcode-lines{
  display: flex;
  gap: 1.5px;
  height: 22px;
  align-items: stretch;
}
.barcode-lines span{
  background: #2e2b27;
  width: 1.5px;
}
.barcode-lines span.wide{
  width: 3px;
}
.barcode-lines span.thin{
  width: 0.7px;
}
.barcode-num{
  font-size: 6px;
  font-family: monospace;
  color: #8a8278;
  letter-spacing: 1px;
}
.poster-stamp{
  width: 46px; height: 46px;
  border: 1px dashed #8f3d2c;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transform: rotate(-8deg);
}
.stamp-inner{
  width: 38px; height: 38px;
  border: 1px solid #8f3d2c;
  border-radius: 50%;
  color: #8f3d2c;
  font-size: 7px;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  line-height: 1.1;
  text-transform: uppercase;
}

.r-foot{padding:14px 16px 8px;font-size:9.5px;color:#a09890;text-align:center;letter-spacing:0.04em;line-height:1.6}
.r-brand{font-family:'Noto Serif SC',serif;font-weight:700;color:#8f3d2c}

/* ── Character card overlay ── */
.overlay{
  position:absolute;inset:0;
  background:rgba(32,28,24,0.7);
  display:flex;align-items:center;justify-content:center;
  padding: 0 10px;
  opacity:0;pointer-events:none;
  transition:opacity 0.28s;
  z-index:20;border-radius:42px;
}
.overlay.show{opacity:1;pointer-events:all}

.card{
  width:340px;background:#faf7f2;border-radius:24px;overflow:hidden;
  transform:scale(0.9) translateY(20px);transition:all 0.35s cubic-bezier(0.34,1.3,0.64,1);
  box-shadow:0 12px 36px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  max-height: 600px;
}
.overlay.show .card{transform:scale(1) translateY(0)}

.card-top{padding:16px 18px 12px;border-bottom:0.5px solid #e8e3d8;display:flex;gap:12px;align-items:center}
.card-av{
  width:44px;height:44px;border-radius:50%;background:#8f3d2c;
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif SC',serif;font-size:15px;font-weight:700;color:#f7f4ee;
  flex-shrink:0;letter-spacing:0.04em;
  box-shadow:0 2px 8px rgba(143,61,44,0.25);
}
.card-name{font-family:'Noto Serif SC',serif;font-size:14.5px;font-weight:700;color:#2e2b27;letter-spacing:0.03em}
.card-era{font-size:10px;color:#8a8278;margin-top:3px;letter-spacing:0.04em}

/* Card Tabs */
.card-tabs{
  display:flex;
  background:#ece6da;
  border-bottom:0.5px solid #e8e3d8;
}
.card-tab{
  flex:1;
  padding:10px 0;
  font-size:11px;
  text-align:center;
  cursor:pointer;
  color:#8a8278;
  font-weight:500;
  transition:all 0.2s;
}
.card-tab.active{
  color:#2e2b27;
  font-weight:700;
  background:#faf7f2;
}

.card-body{padding:14px 16px 16px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-start}
.card-content-pane{display:none;animation:fi 0.2s ease forwards; height: 100%;}
.card-content-pane.active{display:flex; flex-direction:column; justify-content:space-between;}

.card-quote{font-size:11.5px;line-height:1.7;color:#2e2b27;border-left:3px solid #8f3d2c;padding-left:10px;margin-bottom:8px;font-style:italic}

/* Mini Chat UI inside Card (Pure aesthetic chat without noisy sender labels) */
.card-chat-win{
  background:#f2ece2;
  border-radius:12px;
  padding:8px;
  height:140px;
  overflow-y:auto;
  margin-top:6px;
  display:flex;
  flex-direction:column;
  gap:6px;
  border:1px solid #e2dad0;
  scroll-behavior:smooth;
}
.card-chat-win::-webkit-scrollbar{width:0}
.card-chat-row{
  display:flex;
  flex-direction:column;
  animation:fi 0.2s ease forwards;
}
.card-chat-row.char{align-items:flex-start}
.card-chat-row.user{align-items:flex-end}
.card-chat-bubble{
  padding:8px 12px;
  border-radius:12px;
  font-size:11px;
  line-height:1.5;
  max-width:85%;
  word-break:break-all;
}
.card-chat-bubble.char{background:#ece6da;color:#2e2b27;border-bottom-left-radius:2px}
.card-chat-bubble.user{background:#8f3d2c;color:#f7f4ee;border-bottom-right-radius:2px}

/* Card chat micro input */
.card-chat-input-row{
  display:flex;
  gap:6px;
  margin-top:8px;
  align-items:center;
}
.card-chat-input{
  flex:1;
  border:1px solid #dcd7cd;
  background:#fdfcf9;
  border-radius:8px;
  padding:6px 10px;
  font-size:11px;
  outline:none;
  color:#2e2b27;
  height:28px;
}
.card-chat-send{
  background:#2e2b27;
  border:none;
  border-radius:8px;
  width:28px;
  height:28px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: opacity 0.2s;
}
.card-chat-send:hover{opacity:0.8}
.card-chat-send svg{width:11px;height:11px;fill:#fdfcf9}

/* Character Card Tab 2 styling */
.card-career-title{font-size:11px;font-weight:700;color:#8f3d2c;margin-bottom:4px;display:flex;align-items:center;gap:4px;}
.card-career-desc{font-size:10.5px;line-height:1.6;color:#4a423a}

/* Scroll area for Tab 2 inside character card */
.card-scroll-pane {
  flex: 1;
  overflow-y: auto;
  max-height: 200px;
  padding-right: 4px;
}
.card-scroll-pane::-webkit-scrollbar { width: 3px; }
.card-scroll-pane::-webkit-scrollbar-thumb { background: #ece6da; border-radius: 2px; }

.card-close{
  width:100%;padding:13px;background:#ece6da;border:none;
  font-size:12.5px;font-family:'Noto Sans SC',sans-serif;color:#2e2b27;
  cursor:pointer;letter-spacing:0.06em;transition:all 0.15s;font-weight:700;
  border-top:0.5px solid #e8e3d8;
}
.card-close:hover{background:#2e2b27;color:#f7f4ee}

@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fo{from{opacity:1;transform:translateY(0) translateX(-50%)}to{opacity:0;transform:translateY(8px) translateX(-50%)}}

/* ── API Config Modal ── */
.api-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(32,28,24,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
  backdrop-filter: blur(4px);
}
.api-modal {
  background: #faf7f2;
  border-radius: 20px;
  border: 1px solid #2e2b27;
  width: 320px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(32,28,24,0.3);
  animation: fi 0.32s cubic-bezier(0.34,1.3,0.64,1) forwards;
}
.api-modal-top {
  background: #2e2b27;
  padding: 18px 20px 14px;
}
.api-modal-eyebrow {
  font-size: 9px;
  letter-spacing: 0.2em;
  color: #8a8278;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.api-modal-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 700;
  color: #f7f4ee;
  letter-spacing: 0.04em;
}
.api-modal-sub {
  font-size: 10.5px;
  color: #a09890;
  margin-top: 4px;
  line-height: 1.5;
}
.api-modal-body {
  padding: 18px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.api-field-label {
  font-size: 10.5px;
  font-weight: 700;
  color: #8a8278;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 5px;
}
.api-field-input {
  width: 100%;
  background: #ece6da;
  border: 1px solid #dcd7cd;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  font-family: 'Noto Sans SC', sans-serif;
  color: #2e2b27;
  outline: none;
  transition: border-color 0.18s;
}
.api-field-input:focus {
  border-color: #8f3d2c;
}
.api-field-input::placeholder {
  color: #b8b0a6;
}
.api-field-hint {
  font-size: 9.5px;
  color: #a09890;
  margin-top: 4px;
  line-height: 1.5;
}
.api-confirm-btn {
  width: 100%;
  background: #2e2b27;
  color: #f7f4ee;
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.06em;
  transition: opacity 0.18s;
}
.api-confirm-btn:hover { opacity: 0.82; }
.api-confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.api-error-tip {
  font-size: 10.5px;
  color: #8f3d2c;
  text-align: center;
  display: none;
  margin-top: -6px;
}
</style>
</head>
<body>

<div class="phone-wrap">
  <div class="phone">
    <div class="notch"><div class="notch-pill"></div></div>

    <div class="hd">
      <div class="hd-dot"></div>
      <div class="hd-text">
        <div class="hd-name">自我使用说明书</div>
        <div class="hd-sub">高考志愿填报专属探索器</div>
      </div>
    </div>

    <!-- chat -->
    <div class="msgs" id="msgs"></div>

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function stripReportHeading(text) {
  return String(text || '')
    .replace(/^\s*[#>*\-\d.、]+\s*/, '')
    .replace(/^\s*【?[^】:\n]{1,24}】?\s*[：:]?\s*/, '')
    .trim();
}

function extractReportSection(text, labels, allLabels) {
  const source = String(text || '');
  let hit = null;
  labels.forEach(label => {
    const index = source.indexOf(label);
    if (index >= 0 && (!hit || index < hit.index)) hit = { index, label };
  });
  if (!hit) return '';
  let start = hit.index + hit.label.length;
  let end = source.length;
  allLabels.forEach(label => {
    const index = source.indexOf(label, start);
    if (index >= 0 && index < end) end = index;
  });
  return source.slice(start, end)
    .replace(/^\s*[】）)\]*#：:\-—|]+\s*/, '')
    .replace(/\s*[#>*\-]+\s*$/, '')
    .trim();
}

function parseReportPayload(text, forceReport = false) {
  const source = String(text || '').trim();
  const marker = source.match(/【\s*(?:个人)?说明书\s*】/);
  const afterMarker = marker ? source.slice(marker.index + marker[0].length).trim() : source;
  const pipeParts = afterMarker.split(/\s*\|\|\s*/).map(s => s.trim()).filter(Boolean);
  if (pipeParts.length >= 7) {
    return {
      badge: pipeParts[0], tagline: pipeParts[1],
      drive: pipeParts[2], glow: pipeParts[3],
      note: pipeParts[4], bug: pipeParts[5],
      major: pipeParts.slice(6).join('||')
    };
  }

  const groups = {
    badge: ['专属称号', '你的称号'],
    tagline: ['一句话Tagline', '一句话标签', 'Tagline'],
    drive: ['核心驱动'],
    glow: ['发光条件'],
    note: ['使用须知'],
    bug: ['已知Bug', '已知 Bug', '耗电模式'],
    major: ['建议报考专业方向与现实图景说明', '专业方向与现实图景', '建议报考专业', '专业建议']
  };
  const allLabels = Object.values(groups).flat().sort((a, b) => b.length - a.length);
  const found = {};
  Object.entries(groups).forEach(([key, labels]) => {
    found[key] = extractReportSection(afterMarker, labels, allLabels);
  });
  const sectionCount = ['drive', 'glow', 'note', 'bug', 'major'].filter(key => found[key]).length;
  const looksLikeReport = Boolean(marker) || sectionCount >= 3 || (source.includes('说明书') && sectionCount >= 2);
  if (!forceReport && !looksLikeReport) return null;

  const firstUsefulLine = source.split(/\n+/)
    .map(stripReportHeading)
    .find(line => line && !/^(自我使用说明书|说明书)$/.test(line)) || '一份忠于真实自我的使用说明';
  return {
    badge: found.badge || '你的专属说明书',
    tagline: found.tagline || firstUsefulLine.slice(0, 72),
    drive: found.drive || afterMarker,
    glow: found.glow || '最适合在拥有自主空间、明确目标并能持续获得反馈的环境中发挥。',
    note: found.note || '把这份说明书当作方向提示，并用真实课程体验和实践继续校准。',
    bug: found.bug || '当环境长期缺少意义感或自主权时，容易快速耗电。',
    major: found.major || '请结合说明书正文中的专业建议，继续核对课程、院校培养方案和真实就业环境。'
  };
}

function processResponse(raw, forceReport = false){
  // ── Double-Safety Parse options and character cards ──
  let displayMessage = raw;
  let parsedOptions = [];
  let cardData = null;

  // Extract Option tag safely
  if(displayMessage.includes('【选项】')){
    const optSplit = displayMessage.split('【选项】');
    displayMessage = optSplit[0].trim();
    const optsStr = optSplit[1].trim();
    parsedOptions = optsStr.split('||').map(s => s.trim()).filter(Boolean);
  }

  // Ensure options strictly length <= 4
  if(parsedOptions.length > 4) {
    parsedOptions = parsedOptions.slice(0, 4);
  }
  pendingOptions = parsedOptions; // Keep in cache for seamless card closing flow

  // Extract Character Card safely
  if(displayMessage.includes('【人物卡片】')){
    const cardSplit = displayMessage.split('【人物卡片】');
    displayMessage = cardSplit[0].trim();
    const cardFields = cardSplit[1].split('||').map(s => s.trim());
    if(cardFields.length >= 5){
      cardData = {
        name: cardFields[0],
        era: cardFields[1],
        code: cardFields[2],
        quote: cardFields[3],
        question: cardFields[4].replace(/【选项】[\s\S]*/, '').trim() // Strip nested tags if any
      };
    }
  }

  // Render options only if not matched card (as card overlay takes focus)
  if(!cardData && !reportDone) {
    renderChoices(parsedOptions);
  } else {
    choicesBox.style.display = 'none';
  }

  // ── Trigger Character Card Display ──
  if(cardData && !cardShown){
    if(displayMessage) addMsg('ai', esc(displayMessage));
    pendingCardQ = cardData.question;
    
    hydrateCard(cardData.name, cardData.era, cardData.code, cardData.quote, cardData.question);
    showCard();
    cardShown = true;
    return;
  }

  // ── Trigger Report Generation (The Specs Sheet) ──
  const rd = parseReportPayload(displayMessage, forceReport);
  if(rd){
      lastReport = rd;
      renderReport(rd, false);
      addMsg('ai','✨ 专属自我使用说明书已绘制完成！解锁下方的"我的使用说明书"查看深度志愿指南。');
      reportDone = true;
      choicesBox.style.display = 'none';
      
      unlockReportTab();
      setTimeout(() => {
        switchTab('report');
      }, 1500);

      showChips(['我还有想补充的','解释专业','重新来一遍']);
      return;
  }

  // ── Standard Message Output ──
  const clean = displayMessage.replace(/【[^】]*】[\s\S]*/,'').trim() || displayMessage;
  addMsg('ai', esc(clean));
}

// ── Choices Grid Renderer ──
function renderChoices(optionsArray){
  choicesBox.style.opacity = '1';
  choicesBox.style.pointerEvents = 'all';
  
  if(!optionsArray || optionsArray.length === 0){
    choicesBox.style.display = 'none';
    return;
  }
  
  choicesBox.style.display = 'flex';
  choicesGrid.innerHTML = '';
  optionsArray.forEach(opt => {
    const btn = document.createElement('div');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      inp.value = opt;
      send();
    };
    choicesGrid.appendChild(btn);
  });
}

// ── Card Interaction System ──
let currentActiveCardTab = 'bio';

function switchCardTab(tabName) {
  currentActiveCardTab = tabName;
  document.getElementById('ct-bio').className = 'card-tab' + (tabName === 'bio' ? ' active' : '');
  document.getElementById('ct-career').className = 'card-tab' + (tabName === 'career' ? ' active' : '');
  
  document.getElementById('cc-bio').className = 'card-content-pane' + (tabName === 'bio' ? ' active' : '');
  document.getElementById('cc-career').className = 'card-content-pane' + (tabName === 'career' ? ' active' : '');
}

function hydrateCard(name, era, code, quote, question){
  activeCharCode = code.trim();
  
  // Always use CHARACTER_DB as the single source of truth for name/era/majors/reality
  // to prevent any mismatch between AI-generated card data and the local database
  const info = CHARACTER_DB[activeCharCode] || { name: name, era: era, promptName: name, bioHistory: '暂无传奇经历介绍', majors: '现代相关专业', reality: '请继续对话。' };
  const displayName = info.name;  // Override AI output with canonical DB name
  const displayEra  = info.era;   // Override AI output with canonical DB era

  // Avatar: show the character's Chinese name initials if available, else code
  const avatarText = info.promptName ? info.promptName.slice(0, 2) : activeCharCode;
  document.getElementById('c-av').textContent    = avatarText;
  document.getElementById('c-name').textContent  = displayName;
  document.getElementById('c-era').textContent   = displayEra;
  document.getElementById('c-quote').textContent = '\u300e' + quote + '\u300f';

  document.getElementById('c-bio-history').textContent = info.bioHistory;
  document.getElementById('c-majors').textContent = info.majors;
  document.getElementById('c-reality').textContent = info.reality;

  // Clear & initialize live mini dialogue window (Fully clean UI - no sender labels)
  cardChatWin.innerHTML = '';
  charHistory = [
    { role: 'assistant', content: quote },
    { role: 'assistant', content: question }
  ];
  
  addCardChatBubble('char', quote);
  addCardChatBubble('char', question);

  switchCardTab('bio');
}

function addCardChatBubble(sender, text) {
  const row = document.createElement('div');
  row.className = `card-chat-row ${sender}`;
  row.innerHTML = `<div class="card-chat-bubble ${sender}">${esc(text)}</div>`;
  cardChatWin.appendChild(row);
  cardChatWin.scrollTop = cardChatWin.scrollHeight;
}

// ── Live mini dialogue inside card ──
async function sendCardMsg() {
  if (charChatWaiting) return;
  const text = cardChatInp.value.trim();
  if (!text) return;
  cardChatInp.value = '';

  addCardChatBubble('user', text);
  charHistory.push({ role: 'user', content: text });
  
  charChatWaiting = true;
  const loader = document.createElement('div');
  loader.className = 'card-chat-row char';
  loader.id = 'card-loader';
  loader.innerHTML = `<div class="card-chat-bubble char">正在思索...</div>`;
  cardChatWin.appendChild(loader);
  cardChatWin.scrollTop = cardChatWin.scrollHeight;

  try {
    const charSystemPrompt = CHAR_SYSTEM_PROMPTS[activeCharCode] || `你是${CHARACTER_DB[activeCharCode]?.name || '一位导师'}。简洁解答提问，每次回答45字以内。`;
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + API_KEY },
      body: JSON.stringify({
        model: MODEL, max_tokens: 300, temperature: 0.72,
        messages: [{ role: 'system', content: charSystemPrompt }, ...charHistory]
      })
    });
    const data = await res.json();
    const l = document.getElementById('card-loader'); if (l) l.remove();
    
    if (data.error) {
      addCardChatBubble('char', '时空思绪波段不稳，让我理一理。');
    } else {
      const reply = data.choices?.[0]?.message?.content || '嗯...说得深奥了。';
      charHistory.push({ role: 'assistant', content: reply });
      addCardChatBubble('char', reply);
    }
  } catch (e) {
    const l = document.getElementById('card-loader'); if (l) l.remove();
    addCardChatBubble('char', '信号微弱，请重试一遍。');
  }
  charChatWaiting = false;
}

function showCard(){
  document.getElementById('overlay').classList.add('show');
}

// ── Fast card close: trigger step4 via API call ──
function closeCard(){
  document.getElementById('overlay').classList.remove('show');
  pendingCardQ = '';
  pendingOptions = [];
  // Trigger a fresh AI turn to ask the step4 发光条件 question
  triggerNextStep();
}

async function triggerNextStep(){
  if(waiting) return;
  waiting = true;
  showTyping();

  // Build a silent system nudge to move to the next step
  const stepGuidance = "\n【人物卡片已关闭。现在直接进入第4步：发光条件探索。用一个高度具象的二选一冲突场景提问，场景选项在气泡内必须换行显示，让用户看清楚。比如：\nA. 课程排满、有标准答案、每次能拿高分的温室环境；\nB. 几乎没人管、靠自驱、可能挂科也可能做出让人惊艳东西的荒野环境。\n你更适合哪种？\n附带【选项】格式（精简4字：如【温室高分】||【荒野自驱】||【视情况而定】||【两者都要】）。不要再提人物卡片或让用户选人物。】";

  try {
    const apiMessages = [{role:'system', content:SYSTEM}, ...history];
    apiMessages.push({role:'system', content:stepGuidance});
    const res = await fetch(ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body: JSON.stringify({model:MODEL, max_tokens:400, temperature:0.72, messages:apiMessages})
    });
    const data = await res.json();
    removeTyping();
    if(data.error){ addMsg('ai', esc(data.error.message||'出错了')); waiting=false; return; }
    const raw = data.choices?.[0]?.message?.content || '请继续分享你的想法。';
    history.push({role:'assistant', content:raw});
    processResponse(raw);
  } catch(e){
    removeTyping();
    addMsg('ai','网络请求失败，请检查网络后重试。');
  }
  waiting = false;
}

// ── Floating Lock Tip inside Phone ──
function showLockedTip() {
  const existing = document.getElementById('lock-tip');
  if(existing) return;

  const tip = document.createElement('div');
  tip.id = 'lock-tip';
  tip.style.position = 'absolute';
  tip.style.bottom = '84px';
  tip.style.left = '50%';
  tip.style.transform = 'translateX(-50%)';
  tip.style.background = 'rgba(46, 43, 39, 0.95)';
  tip.style.color = '#f7f4ee';
  tip.style.padding = '10px 18px';
  tip.style.borderRadius = '20px';
  tip.style.fontSize = '11.5px';
  tip.style.zIndex = '99';
  tip.style.whiteSpace = 'nowrap';
  tip.style.boxShadow = '0 6px 20px rgba(0,0,0,0.2)';

    tip.style.animation = 'fo 0.25s ease forwards';

// Unlock report navigation item
function unlockReportTab(){
  const reportTab = document.getElementById('t-report');
  reportTab.className = 'tab';
  reportTab.style.opacity = '1';
  reportTab.style.cursor = 'pointer';
  reportTab.innerHTML = '📜 我的使用说明书';
  reportTab.onclick = () => switchTab('report');
}

// ── Aesthetic Report Parser ──
function parseAestheticContent(rawText) {
  const summaryMatch = rawText.match(/【概括】([\s\S]*?)(?=【深度解析】|$)/);
  const insightMatch = rawText.match(/【深度解析】([\s\S]*?)(?=【行动启示】|$)/);
  const actionMatch  = rawText.match(/【行动启示】([\s\S]*?)$/);

  const summary = summaryMatch ? summaryMatch[1].trim() : '';
  const insight = insightMatch ? insightMatch[1].trim() : '';
  const action  = actionMatch ? actionMatch[1].trim() : '';

  if (!summary && !insight) {
    // Fallback to normal text rendering if AI forgot the custom tags
    return `<div class="r-txt-plain">${esc(rawText)}</div>`;
  }

  let html = '';
  if (summary) {
    html += `<div class="r-txt-summary">⚡ 诊断概括：${esc(summary)}</div>`;
  }
  if (insight) {
    html += `<div class="r-txt-insight">🔮 启发式解读：${esc(insight)}</div>`;
  }
  if (action) {
    html += `<div class="r-txt-action">💡 能量爆发点：${esc(action)}</div>`;
  }
  return html;
}

// ── Report Render (The High Aesthetic Poster Card with Web Scroll Protection) ──
const DIMS = [
  ['核心驱动','drive'],['发光条件','glow'],['使用须知','note'],['已知 Bug','bug']
];

function renderReport(rd, flash=false){
  document.getElementById('r-badge').textContent    = rd.badge;
  document.getElementById('r-line').textContent     = rd.tagline;
  const el = document.getElementById('r-blocks');
  el.innerHTML = '';
  
  DIMS.forEach(([label, key], i)=>{
    const icon = DIM_ICONS[label] || '·';
    const div  = document.createElement('div');
    
    // Add special CSS styles for bug warns
    if(label === '已知 Bug') {
      div.className = 'r-block warning-block' + (flash ? ' flash' : '');
    } else {
      div.className = 'r-block' + (flash ? ' flash' : '');
    }
    
    div.style.animationDelay = flash ? '0ms' : (i*60)+'ms';
    
    let specialInject = '';
    // If core drive, add a beautiful micro mechanical gauge line
    if(label === '核心驱动') {
      specialInject = '<div class="drive-gauge-container"><div class="drive-gauge"></div></div>';
    }

    div.innerHTML =
      '<div class="r-block-head"><span class="r-icon">'+icon+'</span><span class="r-lbl">'+label+'</span></div>'+
      '<div class="r-txt">' + parseAestheticContent(rd[key]) + '</div>' + specialInject;
    el.appendChild(div);
  });

  // Highlight Major directions with the Gold Diagnosis Certificate
  const majorDiv = document.createElement('div');
  majorDiv.className = 'r-block major-recommendation' + (flash ? ' flash' : '');
  majorDiv.style.animationDelay = flash ? '0ms' : '250ms';
  majorDiv.innerHTML = `
    <div class="r-block-head">
      <span class="r-icon">🧭</span>
      <span class="r-lbl">志愿诊断：现代专业与现实生存写照</span>
    </div>
    <div class="r-txt">${esc(rd.major)}</div>
  `;
  el.appendChild(majorDiv);
}

// ── Quick-reply chips ──
function showChips(labels){
  chipsEl.style.display = 'flex';
  chipsEl.innerHTML = '';
  labels.forEach(label=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = label;
    c.onclick = ()=>chipClick(label);
    chipsEl.appendChild(c);
  });
}

function chipClick(label){
  chipsEl.style.display = 'none';
  if(label === '重新来一遍'){
    currentStep = 1;
    history = [];
    cardShown = false; reportDone = false; lastReport = null; pendingCardQ = ''; pendingOptions = [];
    msgsEl.innerHTML = '';
    document.getElementById('r-badge').textContent = '—';
    document.getElementById('r-line').textContent  = '说明书生成后显示在这里';
    document.getElementById('r-blocks').innerHTML  = '';
    
    // Relock navigation Tab
    const reportTab = document.getElementById('t-report');
    reportTab.className = 'tab locked';
    reportTab.style.opacity = '0.45';
    reportTab.style.cursor = 'not-allowed';
    reportTab.innerHTML = '🔒 说明书 (探索中)';
    reportTab.onclick = () => showLockedTip();

    choicesBox.style.display = 'flex';
    switchTab('chat');
    
    // Restart conversation with original options
    setTimeout(() => bootChat(), 300);
    return;
  }
  
  if(label === '解释专业'){
    inp.value = '能帮我详细解释一下说明书里推荐的现代重点专业和真实的就业环境吗？';
  } else if (label === '我还有想补充的') {
    inp.value = '我还有一些性格特征想补充：';
  } else {
    inp.value = label;
  }
  send();
}

// ── Tab switch ──
function switchTab(t){
  const isChat = t==='chat';
  msgsEl.style.display          = isChat ? 'flex'  : 'none';
  chipsEl.style.display         = (isChat && reportDone) ? 'flex' : 'none';
  choicesBox.style.display      = (isChat && !reportDone) ? 'flex' : 'none';
  document.getElementById('rp').style.display       = isChat ? 'none'  : 'flex';
  document.getElementById('inp-row').style.display  = isChat ? 'flex'  : 'none';
  document.getElementById('t-chat').className  = 'tab'+(isChat?' on':'');
  document.getElementById('t-report').className = 'tab'+(!isChat?' on':'');
  
  if(!isChat){
    document.getElementById('rp').scrollTop = 0;
  }
}

// ── Boot ──
function bootChat() {
  setTimeout(()=>{
    showTyping();
    setTimeout(()=>{
      removeTyping();
      const open = '在聊专业前，我想先向你确认一件事——上一次你做一件事做到忘记时间、甚至连饭都忘了吃，具体是在做什么？';
      addMsg('ai', esc(open));
      history.push({role:'assistant', content:open});
      renderChoices(INITIAL_OPTIONS);
    }, 900);
  }, 500);
}

window.addEventListener('load',()=>{
  bootChat();
});
